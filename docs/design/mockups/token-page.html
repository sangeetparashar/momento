<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0">
<title>Momento — Token Page</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #000000;
    --surface: #1A1A1A;
    --surface-elevated: #222222;
    --primary: #00FF88;
    --text-primary: #FFFFFF;
    --text-secondary: #888888;
    --text-tertiary: #555555;
    --border: #2A2A2A;
    --negative: #FF4444;
    --font-mono: 'Space Mono', 'Courier New', monospace;
    --radius-full: 9999px;
    --radius-md: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 20px;
    font-family: var(--font-mono);
  }

  .page-title {
    text-align: center;
    color: var(--primary);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
    font-family: var(--font-mono);
  }

  .page-subtitle {
    text-align: center;
    color: var(--text-tertiary);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 24px;
    font-family: var(--font-mono);
  }

  /* Phone frame */
  .phone {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 40px;
    border: 2px solid #333;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Status bar */
  .status-bar {
    height: 54px;
    padding: 14px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    flex-shrink: 0;
  }

  .status-bar .time { font-size: 15px; }
  .status-bar .icons { font-size: 12px; letter-spacing: 4px; color: var(--text-secondary); }

  /* Content area */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header with back + pill tabs */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 8px 0 20px;
  }

  .back-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .back-btn svg {
    width: 22px;
    height: 22px;
  }

  /* Pill tabs */
  .pill-tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border-radius: var(--radius-full);
    padding: 3px;
    flex: 1;
  }

  .pill-tab {
    flex: 1;
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: var(--radius-full);
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
  }

  .pill-tab:hover { color: var(--text-primary); }

  .pill-tab.active {
    background: var(--surface-elevated);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  /* Token hero */
  .token-hero {
    text-align: center;
    padding: 20px 0 24px;
  }

  .token-symbol {
    font-size: 36px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 2px;
  }

  /* Buy/Sell */
  .buy-sell {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .btn-pill {
    padding: 10px 36px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    border-radius: var(--radius-full);
    cursor: pointer;
  }

  .btn-pill.outline {
    background: transparent;
    border: 1px solid var(--text-secondary);
    color: var(--text-primary);
  }

  .btn-pill.filled {
    background: var(--text-primary);
    border: 1px solid var(--text-primary);
    color: var(--bg);
  }

  /* Stats row */
  .stats-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 0 8px;
    margin-bottom: 32px;
  }

  .stat {
    text-align: center;
  }

  .stat-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-tertiary);
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }

  /* Divider */
  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin-bottom: 24px;
  }

  /* Chart */
  .chart-section {
    width: 100%;
    margin-bottom: 16px;
  }

  .chart-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .chart-area {
    width: 100%;
    height: 180px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .chart-area svg {
    width: 100%;
    height: 100%;
  }

  .chart-months {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
    margin-bottom: 20px;
  }

  .chart-month {
    font-size: 7px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-tertiary);
  }

  /* Time pills */
  .time-pills {
    display: flex;
    gap: 0;
    background: var(--surface);
    border-radius: var(--radius-full);
    padding: 3px;
    align-self: center;
    margin-bottom: 20px;
  }

  .time-pill {
    padding: 6px 14px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: var(--radius-full);
    cursor: pointer;
  }

  .time-pill.active {
    background: var(--surface-elevated);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  /* Tab bar */
  .tab-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 56px;
    background: #0A0A0A;
    border-top: 0.5px solid var(--border);
    flex-shrink: 0;
    padding-bottom: 8px;
  }

  .tab-icon {
    font-size: 22px;
    color: #666;
    cursor: pointer;
    padding: 8px 20px;
  }

  .tab-icon.active { color: var(--text-primary); }

  /* Annotations */
  .annotation {
    position: absolute;
    background: var(--primary);
    color: var(--bg);
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }

  .annotation::before {
    content: '';
    position: absolute;
    width: 20px;
    height: 1px;
    background: var(--primary);
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="page-title">Token Page</div>
  <div class="page-subtitle">Creator Token Detail — $DEEL Example</div>

  <div class="phone">
    <div class="status-bar">
      <span class="time">7:05</span>
      <span class="icons">▮▮▮ ▸ ▮</span>
    </div>

    <div class="content">
      <!-- Header: Back + Pill Tabs -->
      <div class="header">
        <div class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
            <path d="M6 4 C6 4, 18 4, 18 12 C18 20, 6 20, 6 20"/>
          </svg>
        </div>
        <div class="pill-tabs">
          <button class="pill-tab">Profile</button>
          <button class="pill-tab">Posts</button>
          <button class="pill-tab active">Token</button>
        </div>
      </div>

      <!-- Token Symbol -->
      <div class="token-hero">
        <div class="token-symbol">$DEEL</div>
      </div>

      <!-- Buy / Sell -->
      <div class="buy-sell">
        <button class="btn-pill outline">Buy</button>
        <button class="btn-pill filled">Sell</button>
      </div>

      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat">
          <div class="stat-label">Price</div>
          <div class="stat-value">0.004</div>
        </div>
        <div class="stat">
          <div class="stat-label">24H Change</div>
          <div class="stat-value">17%</div>
        </div>
        <div class="stat">
          <div class="stat-label">Market Cap</div>
          <div class="stat-value">10.6K</div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Chart -->
      <div class="chart-section">
        <div class="chart-title">Token Performance</div>
        <div class="chart-area">
          <svg viewBox="0 0 350 160" preserveAspectRatio="none">
            <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#00FF88" stop-opacity="0.12"/>
              <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
            </linearGradient>
            <polygon fill="url(#cg)" points="0,140 20,135 45,128 70,120 95,125 120,115 145,95 170,100 195,85 220,70 245,75 270,60 295,50 320,55 350,40 350,160 0,160"/>
            <polyline fill="none" stroke="#00FF88" stroke-width="2.5" stroke-linejoin="round"
              points="0,140 20,135 45,128 70,120 95,125 120,115 145,95 170,100 195,85 220,70 245,75 270,60 295,50 320,55 350,40"/>
          </svg>
        </div>
        <div class="chart-months">
          <span class="chart-month">Jan</span>
          <span class="chart-month">Feb</span>
          <span class="chart-month">Mar</span>
          <span class="chart-month">Apr</span>
          <span class="chart-month">May</span>
          <span class="chart-month">Jun</span>
          <span class="chart-month">Jul</span>
          <span class="chart-month">Aug</span>
          <span class="chart-month">Sep</span>
          <span class="chart-month">Oct</span>
          <span class="chart-month">Nov</span>
          <span class="chart-month">Dec</span>
        </div>
      </div>

      <!-- Time Range Pills -->
      <div class="time-pills">
        <button class="time-pill active">24H</button>
        <button class="time-pill">7D</button>
        <button class="time-pill">1M</button>
        <button class="time-pill">3M</button>
        <button class="time-pill">1Y</button>
      </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <span class="tab-icon">⌂</span>
      <span class="tab-icon">⊕</span>
      <span class="tab-icon active">◉</span>
    </div>
  </div>
</div>

</body>
</html>
